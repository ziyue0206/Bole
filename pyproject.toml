[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bole"
version = "0.1.0a1"
description = "Benchmark-oriented embodied evaluation and continuous harness learning"
requires-python = ">=3.11"
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
bole = "bole.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bole"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
